[project]
name = "isakisi"
version = "0.1.0"
description = "Yerel iş ilanı keşfi ve başvuru takibi"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14", "sqlalchemy>=2.0", "httpx>=0.28", "pydantic-settings>=2.7",
    "fastapi>=0.115", "uvicorn>=0.34", "jinja2>=3.1", "typer>=0.15",
    "feedparser>=6.0", "beautifulsoup4>=4.13", "pypdf>=5.3",
    "python-docx>=1.1", "reportlab>=4.3", "pyyaml>=6.0",
    "python-multipart>=0.0.20", "itsdangerous>=2.2", "cryptography>=44", "tzdata>=2025.1",
]

[project.scripts]
isakisi = "isakisi.cli:main"

[project.optional-dependencies]
browser = ["playwright>=1.50; python_version < '3.15'"]
semantic = ["sentence-transformers>=3.4; python_version < '3.15'"]

[dependency-groups]
dev = ["pytest>=8.3", "respx>=0.22"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/isakisi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
